# live model output: contract validation, change policy, approvals, gates and verification all apply.
# Re-run after the design revision invalidated the first version (it consumed decision D-2).
response:
  summary: "Document abuse reporting, the configurable takedown rule and the reporter key"
  rationale: "Re-documented after the revision of decision D-2: the threshold and window are now configuration properties with defaults of 3 reporters and 24 hours."
  declaredRisk: LOW
  changes:
    - op: EDIT
      path: src/main/resources/static/openapi.yaml
      find: |2
          - name: stats
            description: Click statistics
      replace: |2
          - name: stats
            description: Click statistics
          - name: abuse
            description: Report abusive links
    - op: EDIT
      path: src/main/resources/static/openapi.yaml
      find: |2

          /{code}:
            get:
              tags: [redirect]
      replace: |2

          /api/v1/links/{code}/reports:
            post:
              tags: [abuse]
              operationId: reportLink
              summary: Report a link for abuse
              description: |
                Anyone can report a link as spam, phishing, malware or other abuse. Once enough distinct reporters have
                reported a link within the takedown window (by default 3 within 24 hours; both are configurable per
                deployment), it is disabled automatically, exactly as by `DELETE /api/v1/links/{code}`: redirects answer
                410 Gone from then on.

                A reporter is identified only by a keyed hash of their network (the IPv4 address or the IPv6 /64 prefix)
                scoped to this link, and counts once however often they report: a repeated report replaces their earlier
                one. Every accepted report is answered with 202 and no body, so the response reveals neither how many
                reports a link has nor whether this report triggered the takedown.
              parameters:
                - $ref: '#/components/parameters/Code'
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/AbuseReportRequest'
                    example:
                      reason: PHISHING
              responses:
                '202':
                  description: Report accepted
                '400':
                  description: |
                    Invalid request. Problem types: `validation-failed` (missing or unknown `reason`, with `errors`),
                    `malformed-request`.
                  content:
                    application/problem+json:
                      schema:
                        oneOf:
                          - $ref: '#/components/schemas/ValidationProblem'
                          - $ref: '#/components/schemas/Problem'
                '404':
                  $ref: '#/components/responses/LinkNotFound'
                '410':
                  description: The link is already disabled (`link-gone`)
                  content:
                    application/problem+json:
                      schema:
                        $ref: '#/components/schemas/Problem'

          /{code}:
            get:
              tags: [redirect]
    - op: EDIT
      path: src/main/resources/static/openapi.yaml
      find: |2
            Problem:
              type: object
              description: RFC 9457 problem details
      replace: |2
            AbuseReportRequest:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [SPAM, PHISHING, MALWARE, OTHER]
                  description: Every reason counts the same towards an automatic takedown

            Problem:
              type: object
              description: RFC 9457 problem details
    - op: EDIT
      path: README.md
      find: |2
        | `shortener.stats.max-days`                | `90`                    | Largest accepted statistics window                   |
      replace: |2
        | `shortener.stats.max-days`                | `90`                    | Largest accepted statistics window                   |
        | `shortener.abuse.reporter-hash-secret`    | random per process      | Reporter fingerprint key; see *Abuse reports* below  |
        | `shortener.abuse.takedown.threshold`      | `3`                     | Distinct reporters that disable a link (at least 2)  |
        | `shortener.abuse.takedown.window`         | `24h`                   | Sliding window in which their reports count          |
    - op: EDIT
