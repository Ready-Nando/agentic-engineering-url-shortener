    - op: EDIT
      path: README.md
      find: "**Persistence.**"
      replace: |2-
        **Abuse reports and automatic takedown.** Anyone can report a link as `SPAM`, `PHISHING`, `MALWARE` or
        `OTHER`. Once `shortener.abuse.takedown.threshold` distinct reporters (default 3) have reported it
        within the sliding `shortener.abuse.takedown.window` (default `24h`), the link is disabled exactly as by
        `DELETE`, so its redirect answers 410. Trust & Safety tunes both per environment without a code change,
        for example with `SHORTENER_ABUSE_TAKEDOWN_THRESHOLD=5` and `SHORTENER_ABUSE_TAKEDOWN_WINDOW=6h`. A
        threshold below 2 or a non-positive window fails startup, so no setting lets a single reporter disable a
        link, and the effective rule is logged at startup. A reporter is stored only as an HMAC-SHA256 of the
        link id and the client's network: the IPv4 address, or the /64 prefix of an IPv6 address, because one
        subscriber usually controls a whole /64. No address is stored, and the same person cannot be linked
        across the links they report. `abuse_report` holds one row per link and reporter; a repeated report
        refreshes that row, so every reporter counts once. Set the key with `ABUSE_REPORTER_HASH_SECRET`
        (`shortener.abuse.reporter-hash-secret`), with the same value on every instance; without it a random
        per-process key is used and reporters count again after a restart or on another instance. Behind a
        reverse proxy, configure `server.forward-headers-strategy` so the client address is the real one.
        Reports are always answered with 202 and no body, so they reveal neither how many reports a link has nor
        how close it is to a takedown. Every takedown is logged at WARN and counted in
        `shortener.abuse.takedowns`.

        **Persistence.**
    - op: EDIT
      path: README.md
      find: |2
        - No rate limiting or abuse protection. That belongs in the gateway or edge layer in front of the
          service.
      replace: |2
        - No rate limiting or bot protection, for abuse reports as for everything else. That belongs in the
          gateway or edge layer in front of the service.
    - op: EDIT
      path: README.md
      find: |2
        - Links do not expire, visitors are not de-duplicated, and there is no abuse reporting.
      replace: |2
        - Links do not expire and visitors are not de-duplicated.
        - Reporters who control several networks can still take a link down together, and there is no moderator
          tooling: reinstating a link means setting its `status` back to `ACTIVE` and its `disabled_at` to
          `NULL` in the database and deleting its `abuse_report` rows, otherwise the next report takes it down
          again.
