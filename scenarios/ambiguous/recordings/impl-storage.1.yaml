        public record ShortLink(
                long id,
                String code,
                String targetUrl,
                LinkStatus status,
                Instant createdAt,
                @Nullable Instant expiresAt,
                @Nullable Instant disabledAt) {

            public boolean isActive() {
                return status == LinkStatus.ACTIVE;
            }

            /**
             * Expiry is derived from {@code expiresAt} whenever it matters instead of being stored as a status, so
             * it takes effect at exactly that instant without a background job.
             */
            public boolean isExpiredAt(Instant instant) {
                return expiresAt != null && !instant.isBefore(expiresAt);
            }
        }
