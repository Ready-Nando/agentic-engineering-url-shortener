            // Parsed here rather than by Jackson, which would also read epoch seconds ("1775000000") into an Instant.
            // The contract is a date-time with offset, and any other format is an invalid expiry.
            private static @Nullable Instant parseExpiry(@Nullable String expiresAt) {
                if (expiresAt == null) {
                    return null;
                }
                try {
                    return OffsetDateTime.parse(expiresAt).toInstant();
                } catch (DateTimeParseException e) {
                    throw new InvalidExpiryException(
                            "expiresAt must be an ISO-8601 date-time with offset, such as 2027-01-01T00:00:00Z");
                }
            }
