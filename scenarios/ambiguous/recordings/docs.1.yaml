    - op: EDIT
      path: README.md
      find: "**Persistence.**"
      replace: |2-
        **Expiry.** A link created with `expiresAt` stops redirecting at that instant: the redirect answers
        410 Gone with the same `link-gone` problem as a disabled link (its detail says when the link expired),
        no click is recorded, and `shortener.redirects{outcome=expired}` is incremented. Expiry is evaluated
        against the clock on every redirect instead of being stored as a status, so it takes effect exactly on
        time without a background job; `status` stays `ACTIVE`, and the link, its statistics and its code
        remain, as for a disabled link. `expiresAt` must be a date-time with offset, in the future and at most
        365 days ahead; a retry with the same `Idempotency-Key` is still replayed after that expiry has passed.
        Links created without it, including all links created before expiry existed, never expire.

        **Persistence.**
