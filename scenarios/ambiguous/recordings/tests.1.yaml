      replace: |2
                String withoutAlias = LinkService.requestHash(new CreateLinkCommand("https://example.org", null, null, "k"));
                String withAlias = LinkService.requestHash(new CreateLinkCommand("https://example.org", "abcd", null, "k"));

                assertThat(withoutAlias).hasSize(64).isNotEqualTo(withAlias);
            }

            @Test
            void requestHashDistinguishesExpiries() {
                String never = LinkService.requestHash(new CreateLinkCommand("https://example.org", null, null, "k"));
                String april = LinkService.requestHash(
                        new CreateLinkCommand("https://example.org", null, Instant.parse("2026-04-01T00:00:00Z"), "k"));
                String may = LinkService.requestHash(
                        new CreateLinkCommand("https://example.org", null, Instant.parse("2026-05-01T00:00:00Z"), "k"));

                assertThat(List.of(never, april, may)).doesNotHaveDuplicates();
            }

            @Test
            void requestHashOfRequestsWithoutExpiryIsUnchanged() {
                // Idempotency keys stored before expiry existed must keep matching retries of the same request.
                assertThat(LinkService.requestHash(new CreateLinkCommand("https://example.org/checkout", null, null, "k")))
                        .isEqualTo("e385789bbe7018ea23ea1b03a462d1a9ffb6477e8e5363a53a36058a96fc49a8");
                assertThat(LinkService.requestHash(new CreateLinkCommand("https://example.org/checkout", "sale-2026", null, "k")))
                        .isEqualTo("6b3c7a8bf177d485713a8424cb6728e32a1318ed0847e4f6836b1171faca4570");
            }

            @Test
            void replaysARetryWhoseExpiryHasPassedSinceTheOriginalRequest() {
                // The original request was accepted a minute ago; its retry arrives after the expiry it asked for.
                CreateLinkCommand command = new CreateLinkCommand("https://example.org/a", null, NOW.minusSeconds(1), "order-43");
                ShortLink original = new ShortLink(8, "Wx12346", "https://example.org/a", LinkStatus.ACTIVE,
                        NOW.minusSeconds(60), NOW.minusSeconds(1), null);
                when(repository.findByIdempotencyKey("order-43")).thenReturn(
                        Optional.of(new IdempotentLink(original, LinkService.requestHash(command))));

                CreateLinkResult result = service.create(command);

                assertThat(result.replayed()).isTrue();
                assertThat(result.link()).isEqualTo(original);
            }

            @Test
            void rejectsANewRequestWhoseExpiryIsNotInTheFuture() {
                CreateLinkCommand command = new CreateLinkCommand("https://example.org/a", null, NOW, "order-44");
                when(repository.findByIdempotencyKey("order-44")).thenReturn(Optional.empty());

                assertThatThrownBy(() -> service.create(command))
                        .isInstanceOf(InvalidExpiryException.class)
                        .hasMessage("expiresAt must be in the future");
                verify(repository, never()).insert(anyString(), anyString(), any(), any(), any(), any());
            }

            @Test
            @DisplayName("AC-3: a link resolves normally until its expiry")
            void resolvesALinkBeforeItsExpiry() {
                ShortLink link = new ShortLink(9, "offer01", "https://example.org/offer", LinkStatus.ACTIVE, NOW,
                        NOW.plusSeconds(1), null);
                when(repository.findByCode("offer01")).thenReturn(Optional.of(link));

                assertThat(service.resolve("offer01")).isEqualTo(link);
                assertThat(redirects("found")).isEqualTo(1);
            }

            @Test
            @DisplayName("AC-3: resolving an expired link fails as gone and is counted as an expired redirect")
            void resolvingAnExpiredLinkIsGoneAndCountedAsExpired() {
                when(repository.findByCode("offer02")).thenReturn(Optional.of(new ShortLink(10, "offer02",
                        "https://example.org/offer", LinkStatus.ACTIVE, NOW.minusSeconds(3600), NOW, null)));

                assertThatThrownBy(() -> service.resolve("offer02"))
                        .isInstanceOf(LinkGoneException.class)
                        .hasMessage("Link 'offer02' expired at 2026-03-15T10:00:00Z");
                assertThat(redirects("expired")).isEqualTo(1);
                assertThat(redirects("gone")).isZero();
            }

            @Test
            @DisplayName("AC-3: a disabled link is reported as disabled even when it has also expired")
            void disablingTakesPrecedenceOverExpiry() {
                when(repository.findByCode("offer03")).thenReturn(Optional.of(new ShortLink(11, "offer03",
                        "https://example.org/offer", LinkStatus.DISABLED, NOW.minusSeconds(7200), NOW.minusSeconds(3600),
                        NOW.minusSeconds(60))));

                assertThatThrownBy(() -> service.resolve("offer03"))
                        .isInstanceOf(LinkGoneException.class)
                        .hasMessage("Link 'offer03' has been disabled");
                assertThat(redirects("gone")).isEqualTo(1);
                assertThat(redirects("expired")).isZero();
            }

            private double redirects(String outcome) {
                return meterRegistry.counter("shortener.redirects", "outcome", outcome).count();
            }
