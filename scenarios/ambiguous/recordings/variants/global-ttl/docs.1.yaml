response:
  summary: "Document the lifetime setting and the behaviour of expired links"
  rationale: "No field is added to the API, so openapi.yaml only describes the redirect's new 404 case. The README gains the setting, the link-not-found case, a design note on expiry and the updated limitation."
  declaredRisk: LOW
  changes:
    - op: EDIT
      path: src/main/resources/static/openapi.yaml
      find: |2
                Answers 302 Found with `Cache-Control: no-store` (not 301) so every click reaches the service
                and disabled links stop working immediately. Each GET is recorded as a click with only the
                referrer host; recording failures never fail the redirect. HEAD requests are not counted.
      replace: |2
                Answers 302 Found with `Cache-Control: no-store` (not 301) so every click reaches the service
                and disabled links stop working immediately. Each GET is recorded as a click with only the
                referrer host; recording failures never fail the redirect. HEAD requests are not counted.

                Every link expires once it is older than the configured lifetime (`shortener.link-lifetime`,
                365 days by default), including links created before expiry existed. An expired link answers
                404 `link-not-found` exactly like an unknown code and records no click; it can still be read,
                with its statistics, through `/api/v1/links/{code}`.
