        | `shortener.stats.max-days`                | `90`                    | Largest accepted statistics window                   |
      replace: |2
        | `shortener.stats.max-days`                | `90`                    | Largest accepted statistics window                   |
        | `shortener.link-lifetime`                 | `365d`                  | Links stop redirecting this long after creation      |
    - op: EDIT
      path: README.md
      find: |2
        | `link-not-found`          | 404    | Unknown code                                                   |
      replace: |2
        | `link-not-found`          | 404    | Unknown code, or a redirect to an expired link                 |
    - op: EDIT
      path: README.md
      find: |2-
        **Persistence.**
      replace: |2-
        **Expiry.** Every link expires `shortener.link-lifetime` (365 days by default) after its `createdAt`,
        including links created before expiry existed. Following an expired link answers 404 `link-not-found`,
        exactly like a code that never existed, records no click and increments
        `shortener.redirects{outcome=expired}`; this also applies to a disabled link once it has expired. Expiry is
        derived from `createdAt` on every redirect instead of being stored, so it needs no migration or background
        job, and changing the setting changes the lifetime of every link at once. The link and its statistics
        remain readable through the API, and its code is never handed out again.

        **Persistence.**
    - op: EDIT
      path: README.md
      find: |2
        - Links do not expire, visitors are not de-duplicated, and there is no abuse reporting.
      replace: |2
        - Visitors are not de-duplicated, and there is no abuse reporting.
        - Every link has the same lifetime; it cannot be set or extended per link. Lowering
          `shortener.link-lifetime` expires every link older than the new value immediately.
